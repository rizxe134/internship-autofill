<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internship Autofill demo</title><link rel="stylesheet" href="chromium/style.css"></head><body><main><div class="brand">Practice application</div><h1>A shorter path to your next role.</h1><p>This is a local practice form. No application is sent. Use the extension to scan, fill, and undo.</p><form class="card"><h2>Summer internship · Application</h2><div class="grid"><label>First name<input name="first_name" autocomplete="given-name"></label><label>Last name<input name="last_name" autocomplete="family-name"></label><label>Email address<input type="email" autocomplete="email"></label><label>Phone number<input type="tel" name="phone"></label><label>University<input name="university"></label><label>Major<input name="major"></label><label>State<select name="state"><option value="">Choose a state</option><option>New York</option><option>California</option><option>Texas</option></select></label><label>Expected graduation date<input type="month" name="graduation"></label><label>LinkedIn URL<input type="url" name="linkedin"></label><label>Resume<input type="file"></label><label>Existing answer<input name="city" value="Keep this answer"></label><label>Unknown question<input name="unfamiliar"></label></div><div class="actions"><button type="button" id="reveal">Reveal another question</button></div><div id="extra"></div><p class="note">Try saving “Why are you interested in this internship?” as a reusable question.</p></form></main><script src="demo.js"></script></body></html>
